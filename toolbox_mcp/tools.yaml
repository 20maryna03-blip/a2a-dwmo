# =============================================================================
# MCP Toolbox for Databases — HTTP Sources
# https://mcp-toolbox.dev/integrations/http/tools/http-tool/
#
# Multi-document YAML: each section separated by ---
# Toolbox binary composes URL as: source.baseUrl + tool.path + queryParams
#
# Start:  bin/toolbox serve --config toolbox_mcp/tools.yaml --address 0.0.0.0 --port 8005
# =============================================================================

---
kind: source
name: arxiv
type: http
baseUrl: "https://export.arxiv.org"
timeout: "30s"
headers:
  User-Agent: "ai-platform-demo/1.0 (toolbox-mcp)"

---
kind: source
name: openalex
type: http
baseUrl: "https://api.openalex.org"
timeout: "30s"
headers:
  User-Agent: "ai-platform-demo/1.0 (toolbox-mcp)"

---
kind: tool
name: search_papers
type: http
source: arxiv
method: GET
path: /api/query
description: >
  Search arXiv for academic papers by keyword.
  Returns Atom XML with paper titles, authors, abstracts, publication dates and arXiv IDs.
  Use this to find research papers on any AI, ML or science topic.
queryParams:
  - name: search_query
    type: string
    description: "Search keywords, e.g. 'all:transformer attention' or 'ti:LLM agents'"
    required: true
  - name: max_results
    type: integer
    description: "Maximum number of papers to return (default 5, max 20)"
    default: 5
    required: false
  - name: sortBy
    type: string
    description: "Sort order: 'submittedDate' for newest first, or 'relevance'"
    default: "submittedDate"
    required: false

---
kind: tool
name: get_trending_ai_papers
type: http
source: arxiv
method: GET
path: "/api/query?search_query=cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL+OR+cat:cs.CV&sortBy=submittedDate"
description: >
  Get the most recently submitted AI and ML papers from arXiv across the key
  categories: cs.AI (AI), cs.LG (machine learning), cs.CL (NLP/LLMs), cs.CV (vision).
  Use this to identify trending research topics and active areas in AI research.
queryParams:
  - name: max_results
    type: integer
    description: "Number of recent papers to fetch (default 20, max 40)"
    default: 20
    required: false

---
kind: tool
name: search_openalex
type: http
source: openalex
method: GET
path: /works
description: >
  Search the OpenAlex open scholarly graph for academic works.
  Returns JSON with titles, citation counts, open-access status, publication years
  and primary topic classification. Use for bibliometric analysis and citation data.
queryParams:
  - name: search
    type: string
    description: "Search keyword or phrase"
    required: true
  - name: per_page
    type: integer
    description: "Number of results to return (default 8, max 25)"
    default: 8
    required: false
