[project]
name = "ai-platform-demo"
version = "1.0.0"
description = "Multi-agent AI research platform: A2A agents, Custom MCP, MCPToolbox MCP, and Prompt Engineering"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # A2A Protocol SDK (Google)
    "a2a-sdk>=0.3.4,<1.0.0",
    # FastMCP — Custom MCP server
    "fastmcp>=2.0.0,<4.0.0",
    # LangGraph — agent workflow orchestration
    "langgraph>=0.3.0",
    "langgraph-checkpoint>=2.0.0",
    # LangChain — LLM abstraction + MCP tool adapters
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    # HuggingFace — open-source LLMs, embeddings, multimodal models
    "langchain-huggingface>=0.1.0",
    # Ollama — local LLM inference (no API key, works offline)
    "langchain-ollama>=1.0.0",
    "huggingface_hub>=0.24.0",
    "sentence-transformers>=3.0.0",
    # Vector database — local semantic search
    "chromadb>=0.5.0",
    # LLM provider
    "openai>=1.0.0,<2.0.0",
    # XML/Atom feed parsing (arXiv API)
    "feedparser>=6.0.0",
    # Web framework / ASGI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.0.0",
    # Config & validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    # Prompt engineering
    "jinja2>=3.1.0",
    # CLI
    "click>=8.0.0",
    # Env file support
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = [
    "shared*",
    "prompts*",
    "custom_mcp*",
    "toolbox_mcp*",
    "vector_mcp*",
    "agents*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
